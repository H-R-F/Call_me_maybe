[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pydantic>=2.0,<3.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

disallow_untyped_defs = true

[tool.flake8]
max-line-length = 100
exclude = [".venv", "__pycache__", ".mypy_cache", ".pytest_cache"]
